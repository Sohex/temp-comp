 setting_ek_crisis_factions_rare_desc: "Из-за [Concept('diseases', 'поветрий')|E] или низкого [Concept( 'county_control', 'контроля' )|E] изредка будут возникать [Concept( 'crisis', 'кризисные' )|E] модификаторы [Concept('county_corruption', 'коррупции в графстве')|E]. Они будут распространяться медленнее."
 setting_ek_crisis_factions_occasional_desc:0 "Из-за [Concept('diseases', 'поветрий')|E] или низкого [Concept( 'county_control', 'контроля' )|E] время от времени будут возникать [Concept( 'crisis', 'кризисные' )|E] модификаторы [Concept('county_corruption', 'коррупции в графстве')|E]. Они будут распространяться медленнее."
 setting_ek_crisis_factions_frequent_desc:0 "Из-за [Concept('diseases', 'поветрий')|E] или низкого [Concept( 'county_control', 'контроля' )|E] будут возникать [Concept( 'crisis', 'кризисные' )|E] модификаторы [Concept('county_corruption', 'коррупции в графстве')|E]. Частота и скорость распространения стандартные."
 setting_ek_crisis_factions_apocalyptic_desc:0 "Из-за [Concept('diseases', 'поветрий')|E] или низкого [Concept( 'county_control', 'контроля' )|E] значительно чаще будут возникать [Concept( 'crisis', 'кризисные' )|E] модификаторы [Concept('county_corruption', 'коррупции в графстве')|E]. Они будут распространяться гораздо быстрее."

