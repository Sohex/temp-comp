l_english:
 emperor_zero.1002.t: "The Arena Awaits"
 emperor_zero.1002.desc: " From the chaos of the Interregnum, [emperor_zero_character.GetTitledFirstName] has risen above the petty squabbles fought by [emperor_zero_character.GetHerHis] lessers. Ordained by fate itself, [emperor_zero_character.GetFirstName] is to gather a sundered Cyrodiil into an Empire whose reach shall engulf all Tamriel.\n\nRulers come before [emperor_zero_character.GetTitledFirstName] to pledge their fealty, while [emperor_zero_character.GetHerHis] army and court swells, each freed from their old loyalties. They stand together, ready for righteous war, as one."
 emperor_zero.1002.a: "Just another pretender."
 emperor_zero.1002.b: "For Cyrodiil! For Tamriel!"

 emperor_zero.1003.desc: "I have risen above the petty squabbles of this Interregnum. Ordained by fate itself, I will raise Cyrodiil up into an Empire, one whose reach shall engulf all Tamriel.\n\nRulers come before me to pledge their fealty, my army and court swells; each and all freed from their old loyalties. They stand together, ready for righteous war, as one."

 emperor_zero.1004.t: "Weight of Destiny"
 emperor_zero.1004.desc: "[emperor_zero_character.GetFirstName] is dead. The realm weeps, and turns to me for guidance, for leadership.\n\nAm I the one to take our people forward? To unite all Tamriel? Can I succeed? \n\nOr must Talos? My [ROOT.Char.Custom2('RelationToMeShort', emperor_zero_character)]'s loyal martial be the one to carry this forward, and finish these conquests?"
 emperor_zero.1004.a: "I will finish this, [emperor_zero_character.GetFirstNameNoTooltip]!"
 emperor_zero.1004.b: "Talos, go forth, bring Tamriel to heel!"

 emperor_zero.1005.t: "Talos is dead"
 emperor_zero.1005.desc: "A courtier, uncertain of your reaction, repeats the words. You throw them from your presence.\n\nO Talos, what we were meant to do together. Tamriel would have buckled before us, but, what now? Am I to carry this destiny alone?"
 emperor_zero.1005.a: "The future is uncertain..."

 emperor_zero.1006.desc: "[emperor_zero_character.GetTitledFirstName] is dead. The realm has turned to me, the eyes of the world with them.\n\nYour life, dear [emperor_zero_character.GetFirstName] is not in vain. It was always to be this way. My hand clutches your crown. My crown.\n\nThose around me weep, dismayed at your loss. But, I live. Cyrodiil lives!"

 emperor_zero.0020_title: "[recipient.GetTitledFirstNameNoTooltip] Submits"

 emperor_zero.0021.opening: "Great [ROOT.Char.GetFirstName], Emperor of Cyrodiil"
 emperor_zero.0021.desc: "Fate is with you, and I am yours. The half-wits who still oppose you will quake when faced with our unity!"
 emperor_zero.0021.a: "Welcome, [recipient.GetFirstNameNoTooltip], to a new Tamriel."

 emperor_zero.0022.opening: "Pretender,"
 emperor_zero.0022.desc: "Do you think all of us are fools, swayed by smooth talk and cheap victories? You are naught but another self-serving upstart, like all those who have tried and failed before you.\n\nIf you wish for my lands, come and try - not with words, but steel and war."
 emperor_zero.0022.a: "Impertinent dog. You will fall."

 emperor_zero.0031.t: "A Stranger..."
 emperor_zero.0031.desc: "A storm rages outside distracting me from proceedings of the court, until a stanger catches my eye, as [talos_character.GetSheHe] kneels before me.\n\n"My most illustrious liege, I am [talos_character.GetFullName]. Facing great desperation in an impossible siege, I was protected by the sky itself, and shouted my enemies to their defeat. With our victory, my troop proclaimed me #bold Talos#!, who kneels before you now, to pledge voice and sword to your service. Accept, and I will crush those who oppose you."\n\nA smile across [talos_character.GetFirstNamePossessive] face, [talos_character.GetSheHe] looks up, eager for my answer."
 emperor_zero.0031.a: "Rise, Talos of Atmora!"
 emperor_zero.0031.b: "Lickspittle, fate only acts through me!"
 DAUGHTERS_OF_ATMORA: "Daughters of Atmora"
 SONS_OF_ATMORA: "Sons of Atmora"

 emperor_zero.0041.t: "Betrayal"
 emperor_zero.0041.desc: "Finally, a moment of peace. The privacy of my chamber brings me a calm and ease, away from courtiers and sycophants circling me, each and all eager for a place in my coronation. \n\nTo my surprise, I see [talos_character.GetFirstName] waiting for me. I embrace [talos_character.GetHerHim] warmly, and invite [talos_character.GetHerHim] to join me in some rest before the ceremony. As I do, [talos_character.GetHerHis] face turns cold and hard. My stomach drops.\n\n"You are not the one." [talos_character.GetFirstName] says, unsheathing a dagger, stepping towards me. "I am."\n\nEverything makes sense now. My mind is clear."
 emperor_zero.0041.a: "[talos_character.GetFirstNameNoTooltip], my friend..."
 emperor_zero.0041.b: "[talos_character.GetFirstNameNoTooltip], you fiend!"
 emperor_zero.0041.b.success: "You defeat [talos_character.GetHerHim]"
 emperor_zero.0041.b.fail: "[talos_character.GetFirstNameNoTooltip] defeats you"

 emperor_zero.0042.t: "The Emperor"
 emperor_zero.0042.desc: "The Palace quarters smoulder behind me. I walk forward, out to the crowds, the soldiers, everyone anxiously awaiting sight of [emperor_zero.GetTitledFirstName].\n\nI clutch my neck tightly, blood pouring onto my hand. My other hand holding the Red Dragon Crown, my crown. It is done. It had to be.\n\nTo watch those before me weep, broken by the realisation that [emperor_zero.GetFirstName] is dead. Killed by those who oppose us, those who oppose Cyrodiil. But, I live. Cyrodiil lives! Hungry for their future, the crowd cheers. One of my soldiers steps forward, and places the crown on my head."
 emperor_zero.0042.a: "I am Tiber Septim. Your Emperor."
 wulfharth_retreats_tooltip: "Wulfharth will leave your side, and work on your behalf elsewhere."
 stormcrown_modifier: "Stormcrown"

 emperor_zero.0043.desc: "Acting quickly, I push [talos_character.GetFirstName] to the ground, knocking the dagger from [talos_character.GetHerHis] hand.\n\nBefore [talos_character.GetSheHe] can react, I unsheathe my blade, and plunge it into [talos_character.GetHerHis] throat. A violent wind shakes the room, knocking me to the floor. My guard fill the room, finding no-one but me."
 emperor_zero.0043.a: "[talos_character.GetFirstNameNoTooltip]?"
 
 emperor_zero.0044.desc: "Before I can act, [talos_character.GetFirstName] knocks me to the ground, slitting my throat with [talos_character.GetHerHis] dagger. My crown thuds as it hits the floor.\n\nMy neck gushes, and the room falls dark. The smell of smoke rushes to me."
 emperor_zero.0044.a: " I see now. I see..."
 emperor_zero.0044.b: "Not like this..."
 HEIRS_OF_EMPEROR_ZERO: "Heirs of [emperor_zero.GetFirstNameNoTooltip]"

 emperor_zero.0045.desc: "A herald brings the news, rushing into your court. [emperor_zero.GetTitledFirstName] is dead, assassinated by the enemies of Cyrodiil.\n\nThe Cyrods have crowned [talos_character.GetTitledFirstName] in [emperor_zero.GetHerHis] steed, united in their support of [talos_character.GetHerHim]. Even their kin to the north have begun to follow. Some whisper that he is the Dragonborn as foretold. No matter the truth of it, war and death are sure to follow this day. But, will [emperor_zero.GetSheHe] succeed?"
 emperor_zero.0045.desc.emperor_zero_dead: "A herald brings the news, rushing into your court. The Cyrods have crowned [talos_character.GetTitledFirstName] as Emperor, all Cyrodiil now united behind [talos_character.GetHerHim]. Even their kin to the north have begun to follow.\n\nSome whisper that [talos_character.GetSheHe] is the Dragonborn, as foretold. No matter the truth of it, war and death are sure to follow. But, will [talos_character.GetSheHe] succeed?"
 emperor_zero.0045.a: "Madness! Simply another pretender. [talos_character.GetFirstName] will fail with the rest."
 emperor_zero.0045.b: "I wonder what [talos_character.GetSheHe] will do next."
 emperor_zero.0045.c: "My liege, my [talos_character.GetTitleTierName]!"

 emperor_zero.0046.desc: "The realm has turned to me, and the eyes of the world with them.\n\nThe Red Dragon Crown of Cyrodiil adorns my head. Cyrodiil is one again, and all Tamriel awaits my next move.\n\nThe masses stand before me now, restless and eager for the future. My Red Legions are among them, ready to fight and die for me. It is time."
 
