#Magnus Cult
 magnus_cult:0 "Magnus Cult"
 magnus_cult_adj:1 "Magnus Cultist"
 magnus_cult_adherent:1 "Magnus Cultist"
 magnus_cult_adherent_plural:1 "Magnus Cultists"
 magnus_cult_desc:0 "Many ancient Manmeri mages readily took to the worship of Magnus and formed cults around the new god. Many of these cults faded into obscurity, but druids who worship the Sun God persist - as do terrifying rumours of wickermen inside which captives are consecrated in a radiant blaze to thank Magnus for the world he created and continues to preserve."
    
