 # Anui-El
 anui_el:0 "Samrukh-Sam"
 anui_el_adj:0 "Samrukho"
 anui_el_adherent:0 "Samrukh Follower"
 anui_el_adherent_plural:0 "Samrukh Followers"
 anui_el_desc:0 "These Imga are beholden to their endemic god, whose name they declaim as Samrukh in their many scattered shrines across the Valenwood. Credited as the creator, Samrukh is chiefly concerned with the spirits of the Imga; he collects them upon death and adds them to the Hollowed Trunk of the Imga afterlife."
