# Imga Faiths
 imga_religion:0 "Imga"
 imga_religion_adj:0 "Imgan"
 imga_religion_adherent:0 "Imga"
 imga_religion_adherent_plural:0 "Imgan"
 imga_religion_desc:0 "The Imga are obscure people and so are their faiths. Whatever catches the interest of the Ape folk, seems to be viable to become a religion. This may explain the different nature of their faiths but their true origin often remains a mystery."

# Ius Cult 
 ius_cult:0 "Ius Cults"
 ius_cult_adj:0 "Ius Cults"
 ius_cult_adherent:0 "Ius Cultist"
 ius_cult_adherent_plural:0 "Ius Cultists"
 ius_cult_desc:0 "Those who revere Ius are a varied flock, for they venerate the many monsters of Valenwood's primeval dawn as extensions of their shapeless god. Chief among these ancient creatures are the avatars of the Storm Boar, Blood-Hungry Hare, Serpent-Vulture, Two-Headed Leopard, and Ugly Toad."
