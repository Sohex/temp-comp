 building_type_ary_firearmsf_01: "Fábricas de armas de fuego"
 building_type_ary_firearmsf_01_desc: "La fábrica zumbaba de ruido día y noche, y el aire estaba cargado de humo, lo que provocaba el descontento del pueblo. Sin embargo, esta era la fuerza del ejército y de la tecnología, que permanecían imparables"
