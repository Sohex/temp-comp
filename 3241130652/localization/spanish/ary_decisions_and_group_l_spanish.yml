any_new_traditions_6:0 "Alzar la Bandera Negra"
any_new_traditions_6_desc:0 "Las mareas no piden permiso para arrasar la costa, y nosotros tampoco lo haremos. Como Señores del Mar, hemos escuchado el profundo llamado de las corrientes que exigen tributo. Abandonaremos las nociones 'civilizadas' del comercio y abrazaremos nuestra verdadera naturaleza como heraldos de la tormenta. Desde el norte helado hasta el sur dorado, la visión de nuestras velas anunciará la llegada del Diezmo. El mar nos ha elegido para cosechar la tierra"
any_new_traditions_6_tooltip:0 "Alzar la Bandera Negra"
any_new_traditions_6_confirm:0 "Confirmar"
