any_new_traditions_8:0 "El Exaltado Reino Caballeresco"
any_new_traditions_8_desc:0 "En esta tierra, cada noble es una leyenda en ciernes. El código de caballería ya no es un conjunto de reglas, sino un mandato divino. Uno de nuestros caballeros vale por mil soldados comunes, y sus nombres serán cantados mucho después de que sus huesos se hayan convertido en polvo"
