ary_supreme_blood2_decision:0 "Reclamar la Sangre Fundida"
ary_supreme_blood2_decision_desc:0 "La sangre que corre por nuestras venas ya no es meramente mortal. Brilla con una radiancia no vista desde la era de los dioses, un oro sagrado que porta la voluntad misma de la creación. Donde antes nuestros ancestros caminaban como gobernantes de los hombres, ahora nos encontramos en el umbral de algo mucho más grande"
