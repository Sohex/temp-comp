any_new_traditions_7_desc:0 "La piedra y el mortero obedecen nuestra voluntad como si fueran agua. No nos limitamos a construir castillos; remodelamos el mundo para ajustarlo a nuestra visión. Nuestras ciudades se alzan en semanas donde otros tardan décadas, y nuestros salones están construidos para resistir el fin mismo del tiempo"
any_new_traditions_7_tooltip:0 "Señores de la Estructura y el Acero"
any_new_traditions_7_confirm:0 "Confirmar"
