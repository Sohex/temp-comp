any_new_traditions_5:0 "La Transmutación Alquímica del Ícor"
any_new_traditions_5_desc:0 "La sangre roja es la marca de lo efímero; se oxida, se desvanece y finalmente falla. Pero en nuestras venas yace la chispa latente de los Primogénitos. Para reclamar nuestro derecho de nacimiento, debemos someternos a la Gran Calcinación, purgando las impurezas carmesí de nuestra mortalidad hasta que nuestras venas fluyan con Oro Fundido. Nos convertiremos en estatuas de luz viviente. Mientras las masas comunes pueden marchitarse como hojas de otoño, nosotros permaneceremos firmes ante los siglos. Nuestra sangre no solo nos sostendrá: cantará con la resonancia de las estrellas, haciéndonos tan inmutables como los cimientos mismos del mundo. No solo vivimos; perduramos"
any_new_traditions_5_tooltip:0 "La Transmutación Alquímica del Ícor"
any_new_traditions_5_confirm:0 "Confirmar"
