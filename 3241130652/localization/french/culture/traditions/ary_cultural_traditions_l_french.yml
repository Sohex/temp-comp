 tradition_more_1_name:0 "Nouvel Avenir"
 tradition_more_1_desc:1 "Les 10 emplacements de traditions gratuits fonctionneront lorsque vous ajouterez une tradition et rechargerez la partie après l’avoir ajoutée. N’oubliez pas de sauvegarder votre partie si vous n’êtes pas en mode Ironman"
 tradition_outlaws_king_name:0 "Le Roi Hors-la-loi"
 tradition_outlaws_king_desc:1 "Tu veux que j’arrête de te piller ? Ha ha ha ! Tu sais ce qu’on dit ? L’or, c’est le pouvoir, et le pouvoir, c’est l’or ! Je n’arrêterai jamais de te piller !"
