 building_type_ary_firearmsf_01: "Usines d’armes à feu"
 building_type_ary_firearmsf_01_desc: "L’usine bourdonnait de bruit jour et nuit, et l’air était épais de fumée, suscitant le mécontentement du peuple. Cependant, c’était là la puissance de l’armée et de la technologie, qui demeurait irrésistible"
