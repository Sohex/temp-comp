any_new_traditions_6:0 "Hisser le Pavillon Noir"
any_new_traditions_6_desc:0 "Les marées ne demandent pas la permission d’effacer les rivages, et nous non plus. En tant que Seigneurs de la Mer, nous avons entendu l’appel profond des courants exigeant tribut. Nous rejetterons les notions « civilisées » du commerce et embrasserons notre véritable nature de hérauts de la tempête. Du nord glacé au sud doré, la vue de nos voiles annoncera la venue du Tribut. La mer nous a choisis pour moissonner la terre"
any_new_traditions_6_tooltip:0 "Hisser le Pavillon Noir"
any_new_traditions_6_confirm:0 "Confirmer"
