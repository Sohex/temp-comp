any_new_traditions_8:0 "Le Royaume Chevaleresque Exalté"
any_new_traditions_8_desc:0 "Dans cette terre, chaque noble est une légende en devenir. Le code de chevalerie n’est plus un simple ensemble de règles, mais un mandat divin. Un seul de nos chevaliers vaut mille soldats ordinaires, et leurs noms seront chantés bien après que leurs os se seront changés en poussière"
any_new_traditions_8_tooltip:0 "Le Royaume Chevaleresque Exalté"
any_new_traditions_8_confirm:0 "Confirmer"
