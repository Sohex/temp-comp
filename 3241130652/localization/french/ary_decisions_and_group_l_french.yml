any_new_traditions_5:0 "La Transmutation Alchimique de l’Ichor"
any_new_traditions_5_desc:0 "Le sang rouge est la marque de l’éphémère ; il rouille, il pâlit et finit par faillir. Mais dans nos veines réside l’étincelle dormante des Premiers-Nés. Pour revendiquer notre droit de naissance, nous devons subir la Grande Calcination, purifiant les impuretés cramoisies de notre mortalité jusqu’à ce que nos veines coulent d’Or en Fusion. Nous deviendrons tels des statues de lumière vivante. Tandis que les masses communes peuvent se flétrir comme des feuilles d’automne, nous resterons droits face aux siècles. Notre sang ne fera pas que nous soutenir — il chantera avec la résonance des étoiles, nous rendant aussi immuables que les fondations mêmes du monde. Nous ne faisons pas que vivre ; nous perdurons"
any_new_traditions_5_tooltip:0 "La Transmutation Alchimique de l’Ichor"
any_new_traditions_5_confirm:0 "Confirmer"
