any_new_traditions_7:0 "Seigneurs de la Structure et de l’Acier"
any_new_traditions_7_desc:0 "La pierre et le mortier obéissent à notre volonté comme s’ils étaient de l’eau. Nous ne nous contentons pas de bâtir des châteaux ; nous remodelons le monde afin qu’il corresponde à notre vision. Nos cités s’élèvent en quelques semaines là où d’autres mettent des décennies, et nos halls sont construits pour résister à la fin même du temps"
any_new_traditions_7_tooltip:0 "Seigneurs de la Structure et de l’Acier"
any_new_traditions_7_confirm:0 "Confirmer"
