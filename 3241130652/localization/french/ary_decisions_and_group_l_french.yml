ary_supreme_blood2_decision:0 "Revendiquer le Sang en Fusion"
ary_supreme_blood2_decision_desc:0 "Le sang qui coule dans nos veines n’est plus simplement mortel. Il scintille d’une radiance inconnue depuis l’âge des dieux, un or sacré qui porte la volonté même de la création. Là où nos ancêtres marchaient jadis en tant que souverains des hommes, nous nous tenons désormais au seuil de quelque chose de bien plus grand"
ary_supreme_blood2_decision_tooltip:0 "Revendiquer le Sang en Fusion"
ary_supreme_blood2_decision_confirm:0 "Confirmer"

