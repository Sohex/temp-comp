any_new_traditions_3_desc:0 "Depuis des générations, nos guerriers gardent les forêts anciennes et maîtrisent les secrets de la guerre sylvestre. Désormais, les anciens liens s’approfondissent, et notre peuple ne se contentera plus de défendre les terres sauvages — nous les gouvernerons en souverains de la feuille, de la racine et de l’ombre"
