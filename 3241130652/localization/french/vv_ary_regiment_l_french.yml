vv_mammonth3:0 "Mammouths de l’Effroi"
vv_mammonth3_flavor:0 "D’anciens colosses venus des étendues glacées, protégés par une armure de fer et une épaisse fourrure. Ce sont de véritables machines de siège vivantes qui piétinent les formations ennemies dans le pergélisol."
vv_ary_black_knights:0 "Chevaliers Noirs"
vv_ary_black_knights_flavor:0 "Des figures ominieuses vêtues d’acier couleur de minuit. Ces sombres cavaliers sont la main de l’ombre de leur seigneur, apportant une fin froide et inexorable à tous ceux qui se dressent sur leur chemin."
vv_ary_valkyrie:0 "Cavalières Valkyries"
vv_ary_valkyrie_flavor:0 "Des jeunes filles célestes descendues des salles des braves. Ces guerrières éthérées chevauchent les nuages pour réclamer les âmes des dignes, leur arc brillant de la lumière du divin."

