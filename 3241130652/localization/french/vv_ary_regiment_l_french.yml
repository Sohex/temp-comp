vv_ary_mhashashin:0 "Maître Hashashin"
vv_ary_mhashashin_flavor:0 "Les héritiers d’élite d’anciennes inscriptions et de savoirs interdits ; ils incarnent la flamme finale et éternelle du Vieil Homme de la Montagne."
