any_new_traditions_5:0 "The Alchemical Transmutation of Ichor"
any_new_traditions_5_desc:0 "Red blood is the mark of the ephemeral; it rusts, it pales, and it eventually fails. But within our veins lies the dormant spark of the First-Born. To claim our birthright, we must undergo the Great Calcination, purging the crimson impurities of our mortality until our veins run with Molten Gold. We shall become as statues of living sunlight. While the common masses may wither like autumn leaves, we shall stand unbowed by the centuries. Our blood will not merely sustain us—it will sing with the resonance of the stars, rendering us as immutable as the very foundations of the world. We do not merely live; we endure"
any_new_traditions_5_tooltip:0 "The Alchemical Transmutation of Ichor"
any_new_traditions_5_confirm:0 "Confirm"
