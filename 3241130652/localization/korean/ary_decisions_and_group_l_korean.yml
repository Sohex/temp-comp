any_new_traditions_6:0 "Raising the Black Flag"
any_new_traditions_6_desc:0 "The tides do not ask for permission to wash away the shore, and neither shall we. As Lords of the Sea, we have heard the deep call of the currents demanding tribute. We shall cast aside the 'civilized' notions of trade and embrace our true nature as the storm’s heralds. From the frozen north to the golden south, the sight of our sails shall mean the coming of the Tithe. The sea has chosen us to harvest the land"
